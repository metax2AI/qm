name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-typecheck:
    name: Core typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and typecheck
        run: |
          npm ci
          npm run typecheck

  core-tests:
    name: Core tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Verify root test shard plan
        if: matrix.shard == 1
        run: npm run test:root:shard:check
      - name: Root tests
        env:
          CORE_TEST_SHARD: ${{ matrix.shard }}/5
        run: npm run test:root:shard

  core:
    name: Core
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - core-typecheck
      - core-tests
      - runner-docker
    steps:
      - name: Core checks passed
        run: |
          test "${{ needs.core-typecheck.result }}" = success
          test "${{ needs.core-tests.result }}" = success
          test "${{ needs.runner-docker.result }}" = success

  runner-docker:
    name: Runner Docker tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build test and production images
        run: |
          npm run sandbox:local:build
          docker build -f deploy/egress-proxy/Dockerfile -t qm-egress-proxy:local .
          docker build -f deploy/runner/Dockerfile -t qm-runner:ci .
          docker run --rm qm-runner:ci node --check src/runner-main.ts
      - name: Real Docker isolation and restart tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qm
          RUNNER_DOCKER_REQUIRED: "1"
        run: npm run test:runner:docker
      - name: Boot the production Runner image on XFS
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          truncate -s 2G /tmp/qm-runner-ci.xfs
          mkfs.xfs -f /tmp/qm-runner-ci.xfs
          sudo mkdir -p /mnt/qm-runner-ci
          sudo mount -o loop,pquota /tmp/qm-runner-ci.xfs /mnt/qm-runner-ci
          sudo xfs_quota -x -c "state -p" /mnt/qm-runner-ci
          docker run --rm -v /mnt/qm-runner-ci:/mnt/qm-runner-ci --entrypoint sh qm-runner:ci \
            -c 'ls -la /mnt/qm-runner-ci; xfs_quota -x -c "state -p" /mnt/qm-runner-ci || true'
          docker run -d --name qm-ci-registry -p 5000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/v2/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/v2/
          docker tag qm-sandbox-local:latest localhost:5000/qm-sandbox:ci
          docker push localhost:5000/qm-sandbox:ci
          sandbox_ref=$(docker image inspect localhost:5000/qm-sandbox:ci --format '{{index .RepoDigests 0}}')
          docker network create qm-runner-ci
          docker run -d --name qm-runner-ci \
            --network qm-runner-ci \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:48090:48090 \
            --cap-add SYS_ADMIN \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /mnt/qm-runner-ci:/mnt/qm-runner-ci \
            -e ORG_ID=ci \
            -e DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/qm \
            -e SANDBOX_RUNNER_SECRET=ci-runner-signing-secret-that-is-long-enough \
            -e RUNNER_SELF_CONTAINER=qm-runner-ci \
            -e RUNNER_SERVICE_NETWORK=qm-runner-ci \
            -e RUNNER_SANDBOX_HOME_ROOT=/mnt/qm-runner-ci \
            -e RUNNER_SANDBOX_HOME_MB=64 \
            -e RUNNER_SANDBOX_IMAGE="$sandbox_ref" \
            qm-runner:ci
          runner_ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:48090/health; then
              runner_ready=true
              break
            fi
            sleep 1
          done
          if [ "$runner_ready" != true ]; then
            docker logs qm-runner-ci
            exit 1
          fi
          node --input-type=module -e '
            import { mkdtempSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            import { createRunnerSandbox } from "./src/sandbox/runner-sandbox.ts";
            import { createLocalWorkspaceStore } from "./src/workspace/workspace-store.ts";
            const sandbox = createRunnerSandbox(createLocalWorkspaceStore(mkdtempSync(join(tmpdir(), "qm-runner-xfs-"))), {
              baseUrl: "http://127.0.0.1:48090",
              signingSecret: "ci-runner-signing-secret-that-is-long-enough",
            });
            const handle = await sandbox.provision([{ scopeId: "personal:ci-xfs", mountPath: "", mode: "rw" }]);
            await sandbox.writeFile(handle, "quota-smoke.txt", "xfs lifecycle");
            const limit = await sandbox.run(handle, "dd if=/dev/zero of=quota-limit bs=1M count=80 2>/dev/null");
            if (limit.code === 0) throw new Error("XFS home quota was not enforced");
            await sandbox.teardown(handle, { destroy: true });
          '
          test -z "$(find /mnt/qm-runner-ci/ci/scopes -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -z "$(find /mnt/qm-runner-ci/.projects -mindepth 1 -maxdepth 1 -type f -print -quit)"
      - name: Clean up Runner smoke test
        if: always()
        run: |
          docker rm -f qm-runner-ci qm-ci-registry 2>/dev/null || true
          docker network rm qm-runner-ci 2>/dev/null || true
          sudo umount /mnt/qm-runner-ci 2>/dev/null || true

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            package-lock.json
      - name: Install, typecheck, unit + packaged-artifact + e2e tests
        working-directory: cli
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:e2e
      - name: Install root dependencies
        run: npm ci
      - name: Build the CLI package
        working-directory: cli
        run: npm run build
      - name: Deployment stack contracts
        run: |
          npm run typecheck:contract
          node --test "deploy/stacks/*/test/*.test.ts"

  cli-version:
    name: CLI version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version bump when the published package changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only "$base" "$HEAD_SHA" -- \
            cli/bin cli/src cli/templates cli/manifest.json cli/package.json \
            cli/package-lock.json cli/README.md cli/LICENSE cli/tsconfig.json cli/tsconfig.build.json)
          [ -n "$changed" ] || exit 0
          base_version=$(git show "${base}:cli/package.json" | jq -r .version)
          head_version=$(git show "${HEAD_SHA}:cli/package.json" | jq -r .version)
          highest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -1)
          if [ "$base_version" = "$head_version" ] || [ "$highest" != "$head_version" ]; then
            printf '%s\n' "$changed" >&2
            echo "these files ship in @yc-software/qm; bump cli/package.json past $base_version" >&2
            exit 1
          fi
          case "$head_version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "cli/package.json version must be semver, got $head_version" >&2; exit 1 ;;
          esac

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/web-ui/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix plugins/web-ui
      - name: Formatting
        run: npm run format:check
      - name: Lint whole repo, incl. plugins
        run: npm run lint
      - name: Dead code (knip)
        run: npm run lint:knip
      - name: Oxlint
        run: npm run lint:ox

  core-postgres:
    name: Core Postgres tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Postgres-backed tests (durability + cross-process)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qm
        run: npm run test:pg

  admin-plugin:
    name: Admin plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: plugins/admin/package-lock.json
      - name: Install, typecheck, test
        working-directory: plugins/admin
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build and boot production image
        run: bash scripts/smoke-surface-image.sh admin

  web-ui-plugin:
    name: Web UI plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/web-ui/package-lock.json
      - name: Install core dependencies
        run: npm ci
      - name: Install, typecheck, test, build
        working-directory: plugins/web-ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build and boot production image
        run: bash scripts/smoke-surface-image.sh web-ui

  auth-plugin:
    name: Auth plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: plugins/auth/package-lock.json
      - name: Install, typecheck, test
        working-directory: plugins/auth
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build and boot production image
        run: bash scripts/smoke-surface-image.sh auth

  portal-plugin:
    name: Portal plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: plugins/portal/package-lock.json
      - name: Install, typecheck, test
        working-directory: plugins/portal
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build and boot production image
        run: bash scripts/smoke-surface-image.sh portal
